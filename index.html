<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luv u babychou ♥</title>
<style>
  html,body{margin:0;height:100%;background:#0b0612;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animation : un papillon se transforme en fleur, puis en cœur, puis en texte « Luv u babychou »"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const N = 1600, TAU = Math.PI * 2, rnd = Math.random;
const M = 2.4, HOLD = 3.2, D = 0.7; // durée du morph, durée de pause, décalage max par caractère (s)
const DELAY = Array.from({length: N}, () => rnd() * D);
let W, H, S, shapes, t0;

const ease = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const pick = s => s[rnd() * s.length | 0];

// Tri par angle : chaque caractère va vers un point voisin de la forme suivante -> morph fluide
function finish(a, chars) {
  a.forEach(p => { p.ch = pick(chars); p.a = Math.atan2(p.y, p.x); });
  return a.sort((p, q) => p.a - q.a);
}

function scatter() {
  const a = [];
  for (let i = 0; i < N; i++)
    a.push({x: (rnd() * 2 - 1) * W / S / 2, y: (rnd() * 2 - 1) * H / S / 2, h: 220 + rnd() * 100, s: 60, l: 20 + rnd() * 30});
  return finish(a, ".'`,:");
}

function butterfly() { // courbe papillon de Temple Fay
  const a = [];
  for (let i = 0; i < N; i++) {
    const t = rnd() * 12 * Math.PI;
    const r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.sin(t / 12) ** 5;
    const k = i % 3 ? 1 : Math.sqrt(rnd());
    a.push({x: Math.sin(t) * r * k / 3.6, y: (Math.cos(t) * r * k - 0.9) / 3.6, h: 285 - Math.abs(r) * 22, s: 90, l: 50 + 15 * k});
  }
  return finish(a, '*~^+o');
}

function flower() {
  const a = [];
  for (let i = 0; i < N; i++) {
    const u = rnd();
    if (u < .62) { // pétales (rose à 6 pétales)
      const th = rnd() * TAU, k = Math.sqrt(rnd()), r = Math.abs(Math.cos(3 * th)) * .55 * k;
      a.push({x: r * Math.cos(th), y: .3 + r * Math.sin(th), h: 320 + 25 * k, s: 90, l: 75 - 20 * k});
    } else if (u < .74) { // cœur de la fleur
      const th = rnd() * TAU, r = .11 * Math.sqrt(rnd());
      a.push({x: r * Math.cos(th), y: .3 + r * Math.sin(th), h: 48, s: 100, l: 60});
    } else if (u < .88) { // tige
      const y = .2 - rnd() * 1.15;
      a.push({x: .03 * Math.sin(y * 6) + (rnd() - .5) * .03, y, h: 130, s: 60, l: 42});
    } else { // feuilles
      const s = rnd(), side = rnd() < .5 ? -1 : 1, ang = .5;
      const dx = side * Math.cos(ang), dy = Math.sin(ang), along = s * .38, across = Math.sin(Math.PI * s) * .1 * (rnd() * 2 - 1);
      a.push({x: along * dx - across * dy, y: -.5 + along * dy + across * dx, h: 110, s: 65, l: 45});
    }
  }
  return finish(a, '@o*%&');
}

function heart() { // remplissage uniforme de (x²+y²-1)³ - x²y³ ≤ 0, bord plus clair
  const a = [];
  while (a.length < N) {
    const x = (rnd() * 2 - 1) * 1.15, y = rnd() * 2.25 - 1, f = (x * x + y * y - 1) ** 3 - x * x * y ** 3;
    if (f <= 0) a.push({x: x * .8, y: y * .8 - .1, h: 345 + rnd() * 20, s: 95, l: f > -.03 ? 68 : 42 + rnd() * 15});
  }
  return finish(a, '#@*+<3');
}

function text() { // échantillonne les pixels du texte dessiné hors écran
  const lines = W < H * 1.2 ? ['Luv u', 'babychou'] : ['Luv u babychou'];
  const o = document.createElement('canvas'), g = o.getContext('2d'), fs = 120;
  const font = `900 ${fs}px "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif`;
  g.font = font;
  o.width = Math.ceil(Math.max(...lines.map(l => g.measureText(l).width))) + 20;
  o.height = Math.ceil(lines.length * fs * 1.15) + 20;
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  lines.forEach((l, i) => g.fillText(l, o.width / 2, 10 + fs * 1.15 * (i + .5)));
  const d = g.getImageData(0, 0, o.width, o.height).data, px = [];
  for (let y = 0; y < o.height; y += 2)
    for (let x = 0; x < o.width; x += 2)
      if (d[(y * o.width + x) * 4 + 3] > 128) px.push([x, y]);
  px.sort(() => rnd() - .5);
  const sc = Math.min(.9 * W / S / o.width, (lines.length > 1 ? 1.5 : .9) / o.height), a = [];
  for (let i = 0; i < N; i++) {
    const [x, y] = px[i % px.length];
    a.push({x: (x - o.width / 2) * sc, y: (o.height / 2 - y) * sc, h: 320 + 60 * x / o.width, s: 95, l: 68});
  }
  return finish(a, '*+#@%&');
}

// Mouvement propre à chaque forme pendant qu'elle est affichée
const MOD = [
  (x, y, t, i) => [x + .01 * Math.sin(t + i), y + .01 * Math.cos(t * 1.3 + i)], // étoiles
  (x, y, t) => [x * (.6 + .4 * Math.cos(t * 4)), y + .03 * Math.sin(t * 2)],    // battement d'ailes
  (x, y, t) => [x + .04 * Math.sin(t * 1.5) * (y + 1), y],                       // fleur qui se balance
  (x, y, t) => { const k = 1 + .07 * Math.sin(t * 4) ** 8; return [x * k, y * k]; }, // cœur qui bat
  (x, y, t) => [x, y + .012 * Math.sin(t * 3 + x * 5)],                          // vague sur le texte
];

function resize() {
  const r = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * r; c.height = H * r; c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  S = Math.min(W, H) * .42;
  ctx.font = `bold ${Math.max(9, S * .05) | 0}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (shapes) shapes[4] = text();
}

function frame(now) {
  t0 ??= now;
  const t = (now - t0) / 1000;
  const seg = Math.min(t / (M + HOLD) | 0, shapes.length - 2), lt = t - seg * (M + HOLD);
  const A = shapes[seg], B = shapes[seg + 1], ma = MOD[seg], mb = MOD[seg + 1];
  ctx.fillStyle = 'rgba(11,6,18,.3)'; // traînées lumineuses
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {
    const p = A[i], q = B[i], e = ease(clamp((lt - DELAY[i]) / (M - D)));
    const [ax, ay] = ma(p.x, p.y, t, i), [bx, by] = mb(q.x, q.y, t, i);
    const w = Math.sin(Math.PI * e) * .25; // tourbillon au milieu de la transition
    const x = ax + (bx - ax) * e + w * Math.cos(i * 2.4 + t), y = ay + (by - ay) * e + w * Math.sin(i * 2.4 + t);
    const dh = ((q.h - p.h) % 360 + 540) % 360 - 180;
    ctx.fillStyle = `hsl(${p.h + dh * e},${p.s + (q.s - p.s) * e}%,${p.l + (q.l - p.l) * e}%)`;
    ctx.fillText(e < .5 ? p.ch : q.ch, W / 2 + x * S, H / 2 - y * S);
  }
  requestAnimationFrame(frame);
}

resize();
shapes = [scatter(), butterfly(), flower(), heart(), text()];
addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
